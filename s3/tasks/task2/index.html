       <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="article-card">

        <h1>survey form</h1>

        <div class="container">

            <h2>Let us know how we can improve freeCodeCamp.</h2>

            <table>

                <tr>
                    <td>
                        <label for="x">name</label>
                        <input type="text" id="name"
                               placeholder="please enter user name"
                               minlength="5" maxlength="20" id="x">
                        <br><br>
                    </td>
                </tr>


                <tr>
                    <td>
                        <label>email</label>
                        <input type="email" id="email"
                               placeholder="enter your email" required>
                        <br><br>
                    </td>
                </tr>


                <tr>
                    <td>
                        <label>age</label>
                        <input type="number" id ="age"
                               placeholder="age" required min="0" max="90">
                        <br><br>
                    </td>
                </tr>


                <tr>
                    <td>
                        <label>Which option best describes your current role?</label>

                        <select>
                            <option>student</option>
                            <option>full time job</option>
                            <option>part time job</option>
                        </select>

                        <br><br>
                    </td>
                </tr>


                <tr>
                    <td>
                        <label>
                            How likely is that you would recommend freeCodeCamp to a friend?
                        </label>

                        <br>

                        <input type="radio" name="recommend">
                        <label>Definitely</label>

                        <br>

                        <input type="radio" name="recommend">
                        <label>Maybe</label>

                        <br>

                        <input type="radio" name="recommend">
                        <label>Not sure</label>

                        <br><br>
                    </td>
                </tr>


                <tr>
                    <td>
                        <label>What do you like most in FCC</label>

                        <select>
                            <option>select an option</option>
                            <option>Food</option>
                            <option>pepole</option>
                        </select>

                        <br><br>
                    </td>
                </tr>


                <tr>
                    <td>
                        <label>
                            Things that should be improved in the future
                            (Check all that apply):
                        </label>

                        <br>

                        <input type="checkbox">
                        Front-end Projects

                        <br>

                        <input type="checkbox">
                        Back-end Projects

                        <br>

                        <input type="checkbox">
                        Data Visualization
                    </td>
                </tr>

            </table>

        </div>

    </div>

</body>
</html>
